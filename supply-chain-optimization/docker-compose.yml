services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-supply_chain}
      MYSQL_USER: ${MYSQL_USER:-supply_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-supply_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-supply_user}:${MYSQL_PASSWORD:-supply_password}@db:3306/${MYSQL_DATABASE:-supply_chain}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
volumes:
  mysql_data:
